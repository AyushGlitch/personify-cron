name: Personify Daily Log

on:
  schedule:
    # 8:00 AM IST (UTC+5:30) — adjust as needed
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  log-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Log steps and sleep
        env:
          PERSONIFY_EMAIL: ${{ secrets.PERSONIFY_EMAIL }}
          PERSONIFY_PASSWORD: ${{ secrets.PERSONIFY_PASSWORD }}
          DAILY_STEPS: ${{ secrets.DAILY_STEPS }}
          SLEEP_HOURS: ${{ secrets.SLEEP_HOURS }}
          SLEEP_MINUTES: ${{ secrets.SLEEP_MINUTES }}
          PERSONIFY_LOGIN_URL: ${{ secrets.PERSONIFY_LOGIN_URL }}
          SELECTOR_EMAIL: ${{ secrets.SELECTOR_EMAIL }}
          SELECTOR_PASSWORD: ${{ secrets.SELECTOR_PASSWORD }}
          SELECTOR_SIGN_IN: ${{ secrets.SELECTOR_SIGN_IN }}
          STEPS_PAGE_URL: ${{ secrets.STEPS_PAGE_URL }}
          SLEEP_PAGE_URL: ${{ secrets.SLEEP_PAGE_URL }}
          SELECTOR_STEPS_INPUT: ${{ secrets.SELECTOR_STEPS_INPUT }}
          SELECTOR_STEPS_SAVE: ${{ secrets.SELECTOR_STEPS_SAVE }}
          SELECTOR_SLEEP_HOURS_INPUT: ${{ secrets.SELECTOR_SLEEP_HOURS_INPUT }}
          SELECTOR_SLEEP_MINUTES_INPUT: ${{ secrets.SELECTOR_SLEEP_MINUTES_INPUT }}
          SELECTOR_SLEEP_SAVE: ${{ secrets.SELECTOR_SLEEP_SAVE }}
          SELECTOR_STEPS_NAV: ${{ secrets.SELECTOR_STEPS_NAV }}
          SELECTOR_SLEEP_NAV: ${{ secrets.SELECTOR_SLEEP_NAV }}
          HEADLESS: "1"
        run: python log_health.py

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
